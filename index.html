<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07172e">
  <title>Una canción para recordar</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      color: #f4f7ff;
      font-family: Arial, sans-serif;
      text-align: center;
      background:
        radial-gradient(circle at top, #244b78 0%, transparent 48%),
        linear-gradient(160deg, #07172e, #020711);
    }

    .card {
      width: 100%;
      max-width: 420px;
      padding: 34px 24px;
      border: 1px solid #49658a;
      border-radius: 24px;
      background: rgba(8, 24, 46, 0.88);
      box-shadow: 0 18px 50px #0008;
    }

    .moon {
      font-size: 52px;
      margin-bottom: 14px;
    }

    h1 {
      color: #d8e9ff;
      font-size: 29px;
      line-height: 1.3;
    }

    .message {
      color: #c1d2e9;
      line-height: 1.8;
      font-size: 16px;
    }

    .song {
      margin: 28px 0 18px;
      padding: 20px 12px;
      border-radius: 16px;
      background: #132e50;
    }

    .song h2 {
      margin: 8px 0;
      font-size: 21px;
    }

    .button {
      display: block;
      margin-top: 20px;
      padding: 16px;
      border-radius: 30px;
      color: #07172e;
      background: #d8e9ff;
      font-weight: bold;
      text-decoration: none;
    }

    .footer {
      margin-top: 26px;
      color: #91a9c7;
      font-size: 12px;
    }
  </style>
</head>

<body>
  <main class="card">
    <div class="moon">🌙 🐦</div>

    <h1>
      Hay canciones que dicen
      lo que callamos…
    </h1>

    <p class="message">
      A veces, una melodía guarda recuerdos
      que el tiempo no borra.
    </p>

    <section class="song">
      <div style="font-size:32px">♫</div>
      <h2>Me parte el corazón</h2>
      <p class="message">
        Una canción para escuchar con el corazón.
      </p>

      <a class="button"
         href="https://www.youtube.com/results?search_query=Me+parte+el+corazon+vallenato"
         target="_blank"
         rel="noopener noreferrer">
        ▶️ Escuchar en YouTube
      </a>
    </section>

    <p class="footer">
      Un rincón de música y recuerdos 💙
    </p>
  </main>
</body>
</html>
